name: Ahize Ses Testi APK Olustur

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK hazirla
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null 2>&1 || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" >/dev/null 2>&1 || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Proje dosyalarini olustur
        run: |
          mkdir -p AhizeTest/app/src/main/java/com/ahize/test
          mkdir -p AhizeTest/app/src/main/res/drawable

          cat > AhizeTest/settings.gradle << 'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "AhizeTest"
          include ':app'
          EOF

          cat > AhizeTest/build.gradle << 'EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.24' apply false
          }
          EOF

          cat > AhizeTest/gradle.properties << 'EOF'
          org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
          android.useAndroidX=false
          kotlin.code.style=official
          EOF

          cat > AhizeTest/app/build.gradle << 'EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          android {
              namespace 'com.ahize.test'
              compileSdk 34
              defaultConfig {
                  applicationId "com.ahize.test"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          }
          EOF

          cat > AhizeTest/app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />
              <application
                  android:allowBackup="false"
                  android:icon="@drawable/ic_launcher"
                  android:label="Ahize Ses Testi"
                  android:theme="@android:style/Theme.Material.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > AhizeTest/app/src/main/res/drawable/ic_launcher.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path android:fillColor="#E53935" android:pathData="M0,0h108v108h-108z" />
              <path android:fillColor="#FFFFFF" android:pathData="M54,54m-16,0a16,16 0 1,0 32,0a16,16 0 1,0 -32,0" />
              <path android:fillColor="#FFFFFF" android:pathData="M20,50h8v8h-8z" />
              <path android:fillColor="#FFFFFF" android:pathData="M80,50h8v8h-8z" />
          </vector>
          EOF

          cat > AhizeTest/app/src/main/java/com/ahize/test/MainActivity.kt << 'EOF'
          package com.ahize.test

          import android.app.Activity
          import android.content.Context
          import android.graphics.Color
          import android.graphics.Typeface
          import android.media.AudioAttributes
          import android.media.AudioDeviceInfo
          import android.media.AudioFormat
          import android.media.AudioManager
          import android.media.AudioTrack
          import android.os.Build
          import android.os.Bundle
          import android.view.Gravity
          import android.view.View
          import android.view.WindowManager
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.RadioButton
          import android.widget.RadioGroup
          import android.widget.ScrollView
          import android.widget.SeekBar
          import android.widget.TextView
          import kotlin.concurrent.thread
          import kotlin.math.PI
          import kotlin.math.pow
          import kotlin.math.sin

          class MainActivity : Activity() {

              private lateinit var am: AudioManager
              private var track: AudioTrack? = null
              private var worker: Thread? = null

              @Volatile private var running = false
              @Volatile private var freq = 1000.0
              @Volatile private var wave = 0   // 0 sinus, 1 kare, 2 gurultu, 3 tarama
              private var earpiece = true

              private lateinit var btn: Button
              private lateinit var info: TextView
              private lateinit var freqLabel: TextView

              private val sr = 48000

              private fun dp(v: Int) = (v * resources.displayMetrics.density).toInt()

              private fun tv(text: String, size: Float, bold: Boolean = false, color: String = "#FFFFFF"): TextView {
                  return TextView(this).apply {
                      this.text = text
                      textSize = size
                      setTextColor(Color.parseColor(color))
                      if (bold) setTypeface(null, Typeface.BOLD)
                      setPadding(0, dp(8), 0, dp(8))
                  }
              }

              private fun rb(text: String, checked: Boolean): RadioButton {
                  return RadioButton(this).apply {
                      this.text = text
                      id = View.generateViewId()
                      setTextColor(Color.WHITE)
                      isChecked = checked
                  }
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  am = getSystemService(Context.AUDIO_SERVICE) as AudioManager
                  window.addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)

                  val root = ScrollView(this)
                  root.setBackgroundColor(Color.parseColor("#101418"))
                  val col = LinearLayout(this)
                  col.orientation = LinearLayout.VERTICAL
                  col.setPadding(dp(20), dp(32), dp(20), dp(24))
                  root.addView(col)

                  col.addView(tv("Ahize Ses Testi", 26f, true))
                  col.addView(tv("UYARI: Ses çok yüksek olabilir. Telefonu kulağından en az 30 cm uzak tut.", 14f, false, "#FFB74D"))

                  col.addView(tv("Çıkış", 16f, true, "#90CAF9"))
                  val outGroup = RadioGroup(this)
                  val rEar = rb("Ahize (kulak hoparlörü)", true)
                  val rSpk = rb("Alt hoparlör", false)
                  outGroup.addView(rEar)
                  outGroup.addView(rSpk)
                  outGroup.setOnCheckedChangeListener { _, id ->
                      earpiece = (id == rEar.id)
                      if (running) {
                          stopPlayback()
                          startPlayback()
                      }
                  }
                  col.addView(outGroup)

                  col.addView(tv("Ses türü", 16f, true, "#90CAF9"))
                  val waveGroup = RadioGroup(this)
                  val rSin = rb("Sinüs (temiz ton)", true)
                  val rSq = rb("Kare dalga (en yüksek enerji)", false)
                  val rNoise = rb("Beyaz gürültü", false)
                  val rSweep = rb("Frekans taraması (200-6000 Hz)", false)
                  waveGroup.addView(rSin)
                  waveGroup.addView(rSq)
                  waveGroup.addView(rNoise)
                  waveGroup.addView(rSweep)
                  waveGroup.setOnCheckedChangeListener { _, id ->
                      wave = when (id) {
                          rSq.id -> 1
                          rNoise.id -> 2
                          rSweep.id -> 3
                          else -> 0
                      }
                  }
                  col.addView(waveGroup)

                  freqLabel = tv("Frekans: 1000 Hz", 16f, true, "#90CAF9")
                  col.addView(freqLabel)
                  val seek = SeekBar(this)
                  seek.max = 7900
                  seek.progress = 900
                  seek.setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                      override fun onProgressChanged(s: SeekBar?, p: Int, fromUser: Boolean) {
                          freq = (p + 100).toDouble()
                          freqLabel.text = "Frekans: ${p + 100} Hz"
                      }
                      override fun onStartTrackingTouch(s: SeekBar?) {}
                      override fun onStopTrackingTouch(s: SeekBar?) {}
                  })
                  col.addView(seek)

                  btn = Button(this).apply {
                      text = "ÇAL (MAKSİMUM SES)"
                      textSize = 18f
                      setTextColor(Color.WHITE)
                      setBackgroundColor(Color.parseColor("#E53935"))
                      setOnClickListener {
                          if (running) stopPlayback() else startPlayback()
                      }
                  }
                  val lp = LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, dp(64))
                  lp.topMargin = dp(24)
                  col.addView(btn, lp)

                  info = tv("Hazır.", 14f, false, "#B0BEC5")
                  info.gravity = Gravity.CENTER_HORIZONTAL
                  col.addView(info)

                  col.addView(tv("İpucu: Ahize en verimli 1000-3500 Hz arasında çalışır. Kare dalga aynı seviyede daha yüksek algılanır. Çalarken telefonun ses tuşlarıyla da seviyeyi kontrol edebilirsin.", 12f, false, "#78909C"))

                  setContentView(root)
              }

              @Suppress("DEPRECATION")
              private fun routeEarpiece(): Boolean {
                  return if (Build.VERSION.SDK_INT >= 31) {
                      val d = am.availableCommunicationDevices.firstOrNull {
                          it.type == AudioDeviceInfo.TYPE_BUILTIN_EARPIECE
                      }
                      if (d != null) am.setCommunicationDevice(d) else false
                  } else {
                      am.isSpeakerphoneOn = false
                      true
                  }
              }

              @Suppress("DEPRECATION")
              private fun clearRoute() {
                  if (Build.VERSION.SDK_INT >= 31) {
                      am.clearCommunicationDevice()
                  } else {
                      am.isSpeakerphoneOn = false
                  }
              }

              private fun startPlayback() {
                  if (running) return

                  val stream: Int
                  var routeOk = true
                  if (earpiece) {
                      am.mode = AudioManager.MODE_IN_COMMUNICATION
                      stream = AudioManager.STREAM_VOICE_CALL
                      routeOk = routeEarpiece()
                  } else {
                      am.mode = AudioManager.MODE_NORMAL
                      clearRoute()
                      stream = AudioManager.STREAM_MUSIC
                  }

                  val max = am.getStreamMaxVolume(stream)
                  try {
                      am.setStreamVolume(stream, max, 0)
                  } catch (e: Exception) {
                  }
                  val cur = am.getStreamVolume(stream)

                  val attrs = AudioAttributes.Builder()
                      .setUsage(if (earpiece) AudioAttributes.USAGE_VOICE_COMMUNICATION else AudioAttributes.USAGE_MEDIA)
                      .setContentType(if (earpiece) AudioAttributes.CONTENT_TYPE_SPEECH else AudioAttributes.CONTENT_TYPE_MUSIC)
                      .build()
                  val fmt = AudioFormat.Builder()
                      .setSampleRate(sr)
                      .setEncoding(AudioFormat.ENCODING_PCM_16BIT)
                      .setChannelMask(AudioFormat.CHANNEL_OUT_MONO)
                      .build()
                  val minBuf = AudioTrack.getMinBufferSize(sr, AudioFormat.CHANNEL_OUT_MONO, AudioFormat.ENCODING_PCM_16BIT)

                  val t: AudioTrack
                  try {
                      t = AudioTrack.Builder()
                          .setAudioAttributes(attrs)
                          .setAudioFormat(fmt)
                          .setBufferSizeInBytes(maxOf(minBuf, sr / 5 * 2))
                          .setTransferMode(AudioTrack.MODE_STREAM)
                          .build()
                  } catch (e: Exception) {
                      info.text = "Ses başlatılamadı: ${e.message}"
                      return
                  }
                  t.setVolume(1.0f)
                  t.play()
                  track = t
                  running = true

                  worker = thread(isDaemon = true) {
                      val buf = ShortArray(2048)
                      var phase = 0.0
                      var sweepT = 0.0
                      val rnd = java.util.Random()
                      while (running) {
                          for (i in buf.indices) {
                              val f: Double
                              if (wave == 3) {
                                  sweepT += 1.0 / sr
                                  if (sweepT > 6.0) sweepT = 0.0
                                  f = 200.0 * (6000.0 / 200.0).pow(sweepT / 6.0)
                              } else {
                                  f = freq
                              }
                              phase += 2.0 * PI * f / sr
                              if (phase > 2.0 * PI) phase -= 2.0 * PI
                              val s = when (wave) {
                                  1 -> if (phase < PI) 1.0 else -1.0
                                  2 -> rnd.nextDouble() * 2.0 - 1.0
                                  else -> sin(phase)
                              }
                              buf[i] = (s * 32767.0).toInt().coerceIn(-32768, 32767).toShort()
                          }
                          t.write(buf, 0, buf.size)
                      }
                  }

                  btn.text = "DURDUR"
                  btn.setBackgroundColor(Color.parseColor("#455A64"))
                  val outName = if (earpiece) "AHİZE" else "HOPARLÖR"
                  info.text = if (earpiece && !routeOk)
                      "Ahize bulunamadı, varsayılan çıkış kullanılıyor. Ses: $cur/$max"
                  else
                      "Çıkış: $outName | Ses seviyesi: $cur/$max"
              }

              private fun stopPlayback() {
                  running = false
                  try { worker?.join(500) } catch (e: Exception) {}
                  worker = null
                  track?.let {
                      try { it.stop() } catch (e: Exception) {}
                      it.release()
                  }
                  track = null
                  am.mode = AudioManager.MODE_NORMAL
                  if (Build.VERSION.SDK_INT >= 31) am.clearCommunicationDevice()
                  btn.text = "ÇAL (MAKSİMUM SES)"
                  btn.setBackgroundColor(Color.parseColor("#E53935"))
                  info.text = "Durdu."
              }

              override fun onPause() {
                  super.onPause()
                  if (running) stopPlayback()
              }

              override fun onDestroy() {
                  super.onDestroy()
                  if (running) stopPlayback()
              }
          }
          EOF

      - name: APK derle
        working-directory: AhizeTest
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: APK yukle
        uses: actions/upload-artifact@v4
        with:
          name: AhizeSesTesti-APK
          path: AhizeTest/app/build/outputs/apk/debug/app-debug.apk
