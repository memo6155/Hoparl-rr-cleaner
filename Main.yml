name: Tek Dosyadan APK Olustur

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: JDK 17 Kur
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Gradle 8.4 Kur
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Tum Proje Dosyalarini Otomatik Olustur
        run: |
          mkdir -p app/src/main/java/com/temizleyici/ses

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "AhizeTemizleyici"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.0' apply false
          }
          EOF

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.temizleyici.ses'
              compileSdk 34

              defaultConfig {
                  applicationId "com.temizleyici.ses"
                  minSdk 23
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />

              <application
                  android:label="Ahize Temizleyici"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/temizleyici/ses/MainActivity.java
          package com.temizleyici.ses;

          import android.app.Activity;
          import android.content.Context;
          import android.graphics.Color;
          import android.media.AudioAttributes;
          import android.media.AudioFormat;
          import android.media.AudioManager;
          import android.media.AudioTrack;
          import android.os.Bundle;
          import android.view.Gravity;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.SeekBar;
          import android.widget.TextView;

          public class MainActivity extends Activity {
              private volatile boolean isPlaying = false;
              private volatile double currentFreq = 165.0;
              private volatile boolean pulseMode = false;
              private Thread audioThread;
              private AudioManager audioManager;
              private TextView statusText;
              private TextView freqLabel;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  audioManager = (AudioManager) getSystemService(Context.AUDIO_SERVICE);

                  LinearLayout layout = new LinearLayout(this);
                  layout.setOrientation(LinearLayout.VERTICAL);
                  layout.setGravity(Gravity.CENTER);
                  layout.setPadding(48, 48, 48, 48);
                  layout.setBackgroundColor(Color.parseColor("#121212"));

                  statusText = new TextView(this);
                  statusText.setText("Ses seviyesini sonuna kadar acin ve mod secin.");
                  statusText.setTextSize(17f);
                  statusText.setTextColor(Color.WHITE);
                  statusText.setGravity(Gravity.CENTER);
                  statusText.setPadding(0, 0, 0, 48);

                  freqLabel = new TextView(this);
                  freqLabel.setText("Frekans: 165 Hz");
                  freqLabel.setTextSize(16f);
                  freqLabel.setTextColor(Color.parseColor("#00E676"));
                  freqLabel.setGravity(Gravity.CENTER);
                  freqLabel.setPadding(0, 0, 0, 16);

                  SeekBar seekBar = new SeekBar(this);
                  seekBar.setMax(500);
                  seekBar.setProgress(165);
                  seekBar.setOnSeekBarChangeListener(new SeekBar.OnSeekBarChangeListener() {
                      @Override
                      public void onProgressChanged(SeekBar s, int progress, boolean fromUser) {
                          int f = Math.max(50, progress);
                          currentFreq = f;
                          freqLabel.setText("Frekans: " + f + " Hz");
                      }
                      @Override public void onStartTrackingTouch(SeekBar s) {}
                      @Override public void onStopTrackingTouch(SeekBar s) {}
                  });

                  Button btnEarpiece165 = new Button(this);
                  btnEarpiece165.setText("Ahizeyi Temizle (165 Hz - Sabit)");
                  btnEarpiece165.setOnClickListener(v -> {
                      seekBar.setProgress(165);
                      pulseMode = false;
                      startCleaning(true);
                      statusText.setText("Ahize temizleniyor (165 Hz)...\nTelefonu ekran asagi bakacak sekilde tutun.");
                  });

                  Button btnEarpiecePulse = new Button(this);
                  btnEarpiecePulse.setText("Ahize Darbeli Mod (220 Hz - Toz Sokucu)");
                  btnEarpiecePulse.setOnClickListener(v -> {
                      seekBar.setProgress(220);
                      pulseMode = true;
                      startCleaning(true);
                      statusText.setText("Ahize darbeli titresim modu calisiyor...");
                  });

                  Button btnSpeaker = new Button(this);
                  btnSpeaker.setText("Ana Hoparloru Temizle (165 Hz)");
                  btnSpeaker.setOnClickListener(v -> {
                      seekBar.setProgress(165);
                      pulseMode = false;
                      startCleaning(false);
                      statusText.setText("Hoparlor temizleniyor (165 Hz)...");
                  });

                  Button btnStop = new Button(this);
                  btnStop.setText("DURDUR");
                  btnStop.setOnClickListener(v -> {
                      stopCleaning();
                      statusText.setText("Temizleme durduruldu.");
                  });

                  layout.addView(statusText);
                  layout.addView(freqLabel);
                  layout.addView(seekBar);
                  layout.addView(btnEarpiece165);
                  layout.addView(btnEarpiecePulse);
                  layout.addView(btnSpeaker);
                  layout.addView(btnStop);

                  setContentView(layout);
              }

              private void startCleaning(boolean useEarpiece) {
                  stopCleaning();
                  isPlaying = true;

                  if (useEarpiece) {
                      audioManager.setMode(AudioManager.MODE_IN_COMMUNICATION);
                      audioManager.setSpeakerphoneOn(false);
                  } else {
                      audioManager.setMode(AudioManager.MODE_NORMAL);
                      audioManager.setSpeakerphoneOn(true);
                  }

                  audioThread = new Thread(() -> {
                      int sampleRate = 44100;
                      int bufferSize = AudioTrack.getMinBufferSize(
                              sampleRate,
                              AudioFormat.CHANNEL_OUT_MONO,
                              AudioFormat.ENCODING_PCM_16BIT
                      );

                      int usageType = useEarpiece
                              ? AudioAttributes.USAGE_VOICE_COMMUNICATION
                              : AudioAttributes.USAGE_MEDIA;

                      AudioTrack audioTrack = new AudioTrack.Builder()
                              .setAudioAttributes(new AudioAttributes.Builder()
                                      .setUsage(usageType)
                                      .setContentType(AudioAttributes.CONTENT_TYPE_SPEECH)
                                      .build())
                              .setAudioFormat(new AudioFormat.Builder()
                                      .setEncoding(AudioFormat.ENCODING_PCM_16BIT)
                                      .setSampleRate(sampleRate)
                                      .setChannelMask(AudioFormat.CHANNEL_OUT_MONO)
                                      .build())
                              .setBufferSizeInBytes(bufferSize)
                              .build();

                      short[] buffer = new short[bufferSize];
                      double angle = 0.0;
                      long sampleCount = 0;

                      audioTrack.play();

                      while (isPlaying) {
                          double freq = currentFreq;
                          double increment = 2.0 * Math.PI * freq / sampleRate;
                          for (int i = 0; i < buffer.length; i++) {
                              sampleCount++;
                              boolean mute = pulseMode && ((sampleCount / (sampleRate / 4)) % 2 == 1);
                              if (mute) {
                                  buffer[i] = 0;
                              } else {
                                  buffer[i] = (short) (Math.sin(angle) * Short.MAX_VALUE);
                              }
                              angle += increment;
                              if (angle > 2.0 * Math.PI) {
                                  angle -= 2.0 * Math.PI;
                              }
                          }
                          audioTrack.write(buffer, 0, buffer.length);
                      }

                      try {
                          audioTrack.stop();
                      } catch (Exception ignored) {}
                      audioTrack.release();
                  });
                  audioThread.start();
              }

              private void stopCleaning() {
                  isPlaying = false;
                  if (audioThread != null) {
                      try {
                          audioThread.join(400);
                      } catch (InterruptedException ignored) {}
                      audioThread = null;
                  }
                  audioManager.setMode(AudioManager.MODE_NORMAL);
                  audioManager.setSpeakerphoneOn(false);
              }

              @Override
              protected void onDestroy() {
                  super.onDestroy();
                  stopCleaning();
              }
          }
          EOF

      - name: APK Derle
        run: gradle assembleDebug

      - name: APK Dosyasini Yukle
        uses: actions/upload-artifact@v4
        with:
          name: Ahize-Temizleyici-APK
          path: app/build/outputs/apk/debug/app-debug.apk
