name: Ultra Agresif APK Olustur

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: JDK 17 Kur
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Gradle 8.4 Kur
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Tum Proje Dosyalarini Otomatik Olustur
        run: |
          mkdir -p app/src/main/java/com/temizleyici/ses

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "AhizeTemizleyici"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.0' apply false
          }
          EOF

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.temizleyici.ses'
              compileSdk 34

              defaultConfig {
                  applicationId "com.temizleyici.ses"
                  minSdk 23
                  targetSdk 34
                  versionCode 2
                  versionName "2.0-Hardcore"
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />
              <uses-permission android:name="android.permission.VIBRATE" />

              <application
                  android:label="Ahize Temizleyici PRO"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/temizleyici/ses/MainActivity.java
          package com.temizleyici.ses;

          import android.app.Activity;
          import android.content.Context;
          import android.graphics.Color;
          import android.media.AudioAttributes;
          import android.media.AudioFormat;
          import android.media.AudioManager;
          import android.media.AudioTrack;
          import android.media.audiofx.LoudnessEnhancer;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.VibrationEffect;
          import android.os.Vibrator;
          import android.view.Gravity;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.SeekBar;
          import android.widget.TextView;

          public class MainActivity extends Activity {
              private static final int MODE_SINE = 0;
              private static final int MODE_PULSE = 1;
              private static final int MODE_EXTREME = 2;

              private volatile boolean isPlaying = false;
              private volatile double currentFreq = 165.0;
              private volatile int currentMode = MODE_SINE;
              private Thread audioThread;
              private AudioManager audioManager;
              private Vibrator vibrator;
              private TextView statusText;
              private TextView freqLabel;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  audioManager = (AudioManager) getSystemService(Context.AUDIO_SERVICE);
                  vibrator = (Vibrator) getSystemService(Context.VIBRATOR_SERVICE);

                  LinearLayout layout = new LinearLayout(this);
                  layout.setOrientation(LinearLayout.VERTICAL);
                  layout.setGravity(Gravity.CENTER);
                  layout.setPadding(48, 48, 48, 48);
                  layout.setBackgroundColor(Color.parseColor("#0D0D0D"));

                  statusText = new TextView(this);
                  statusText.setText("Mod secin. Agresif mod sesi otomatik %100 yapar ve +15dB zorlar.");
                  statusText.setTextSize(16f);
                  statusText.setTextColor(Color.WHITE);
                  statusText.setGravity(Gravity.CENTER);
                  statusText.setPadding(0, 0, 0, 40);

                  freqLabel = new TextView(this);
                  freqLabel.setText("Frekans: 165 Hz");
                  freqLabel.setTextSize(16f);
                  freqLabel.setTextColor(Color.parseColor("#00E676"));
                  freqLabel.setGravity(Gravity.CENTER);
                  freqLabel.setPadding(0, 0, 0, 16);

                  SeekBar seekBar = new SeekBar(this);
                  seekBar.setMax(600);
                  seekBar.setProgress(165);
                  seekBar.setOnSeekBarChangeListener(new SeekBar.OnSeekBarChangeListener() {
                      @Override
                      public void onProgressChanged(SeekBar s, int progress, boolean fromUser) {
                          int f = Math.max(50, progress);
                          currentFreq = f;
                          freqLabel.setText("Frekans: " + f + " Hz");
                      }
                      @Override public void onStartTrackingTouch(SeekBar s) {}
                      @Override public void onStopTrackingTouch(SeekBar s) {}
                  });

                  Button btnEarpiece165 = new Button(this);
                  btnEarpiece165.setText("Ahize Standart (165 Hz Sinus)");
                  btnEarpiece165.setOnClickListener(v -> {
                      seekBar.setProgress(165);
                      currentMode = MODE_SINE;
                      startCleaning(true, false);
                      statusText.setText("Ahize standart temizleniyor (165 Hz)...");
                  });

                  Button btnEarpiecePulse = new Button(this);
                  btnEarpiecePulse.setText("Ahize Darbeli Mod (220 Hz Pulse)");
                  btnEarpiecePulse.setOnClickListener(v -> {
                      seekBar.setProgress(220);
                      currentMode = MODE_PULSE;
                      startCleaning(true, false);
                      statusText.setText("Ahize darbeli titresim modu calisiyor...");
                  });

                  Button btnExtremeEarpiece = new Button(this);
                  btnExtremeEarpiece.setText("🔥 ULTRA AGRESIF AHIZE (KARE DALGA + 15dB BOOST)");
                  btnExtremeEarpiece.setBackgroundColor(Color.parseColor("#B71C1C"));
                  btnExtremeEarpiece.setTextColor(Color.WHITE);
                  btnExtremeEarpiece.setOnClickListener(v -> {
                      currentMode = MODE_EXTREME;
                      startCleaning(true, true);
                      statusText.setText("⚠️ ULTRA AGRESIF AHIZE AKTIF!\nKare Dalga + +15dB Boost + Sweep + Motor Titresimi.\n(1 dakikadan fazla araliksiz calistirmayin)");
                  });

                  Button btnExtremeSpeaker = new Button(this);
                  btnExtremeSpeaker.setText("🔥 ULTRA AGRESIF ANA HOPARLOR (KARE DALGA + 15dB)");
                  btnExtremeSpeaker.setBackgroundColor(Color.parseColor("#E65100"));
                  btnExtremeSpeaker.setTextColor(Color.WHITE);
                  btnExtremeSpeaker.setOnClickListener(v -> {
                      currentMode = MODE_EXTREME;
                      startCleaning(false, true);
                      statusText.setText("⚠️ ULTRA AGRESIF HOPARLOR AKTIF!\nKare Dalga + +15dB Boost + Otomatik Tarama.");
                  });

                  Button btnStop = new Button(this);
                  btnStop.setText("DURDUR");
                  btnStop.setBackgroundColor(Color.parseColor("#263238"));
                  btnStop.setTextColor(Color.WHITE);
                  btnStop.setOnClickListener(v -> {
                      stopCleaning();
                      statusText.setText("Temizleme durduruldu.");
                  });

                  layout.addView(statusText);
                  layout.addView(freqLabel);
                  layout.addView(seekBar);
                  layout.addView(btnEarpiece165);
                  layout.addView(btnEarpiecePulse);
                  layout.addView(btnExtremeEarpiece);
                  layout.addView(btnExtremeSpeaker);
                  layout.addView(btnStop);

                  setContentView(layout);
              }

              private void maxOutVolume() {
                  try {
                      int maxVoice = audioManager.getStreamMaxVolume(AudioManager.STREAM_VOICE_CALL);
                      audioManager.setStreamVolume(AudioManager.STREAM_VOICE_CALL, maxVoice, 0);
                      int maxMusic = audioManager.getStreamMaxVolume(AudioManager.STREAM_MUSIC);
                      audioManager.setStreamVolume(AudioManager.STREAM_MUSIC, maxMusic, 0);
                  } catch (Exception ignored) {}
              }

              private void startVibration() {
                  if (vibrator != null && vibrator.hasVibrator()) {
                      long[] pattern = {0, 400, 100, 600, 80};
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                          vibrator.vibrate(VibrationEffect.createWaveform(pattern, 0));
                      } else {
                          vibrator.vibrate(pattern, 0);
                      }
                  }
              }

              private void startCleaning(boolean useEarpiece, boolean extremeBoost) {
                  stopCleaning();
                  isPlaying = true;
                  maxOutVolume();

                  if (useEarpiece) {
                      audioManager.setMode(AudioManager.MODE_IN_COMMUNICATION);
                      audioManager.setSpeakerphoneOn(false);
                  } else {
                      audioManager.setMode(AudioManager.MODE_NORMAL);
                      audioManager.setSpeakerphoneOn(true);
                  }

                  if (extremeBoost) {
                      startVibration();
                  }

                  audioThread = new Thread(() -> {
                      int sampleRate = 44100;
                      int bufferSize = AudioTrack.getMinBufferSize(
                              sampleRate,
                              AudioFormat.CHANNEL_OUT_MONO,
                              AudioFormat.ENCODING_PCM_16BIT
                      );

                      int usageType = useEarpiece
                              ? AudioAttributes.USAGE_VOICE_COMMUNICATION
                              : AudioAttributes.USAGE_MEDIA;

                      AudioTrack audioTrack = new AudioTrack.Builder()
                              .setAudioAttributes(new AudioAttributes.Builder()
                                      .setUsage(usageType)
                                      .setContentType(AudioAttributes.CONTENT_TYPE_SPEECH)
                                      .build())
                              .setAudioFormat(new AudioFormat.Builder()
                                      .setEncoding(AudioFormat.ENCODING_PCM_16BIT)
                                      .setSampleRate(sampleRate)
                                      .setChannelMask(AudioFormat.CHANNEL_OUT_MONO)
                                      .build())
                              .setBufferSizeInBytes(bufferSize)
                              .build();

                      LoudnessEnhancer enhancer = null;
                      if (extremeBoost) {
                          try {
                              enhancer = new LoudnessEnhancer(audioTrack.getAudioSessionId());
                              enhancer.setTargetGain(1500); // +15 dB donanimsal zorlama
                              enhancer.setEnabled(true);
                          } catch (Exception ignored) {}
                      }

                      short[] buffer = new short[bufferSize];
                      double angle = 0.0;
                      long sampleCount = 0;
                      double sweepFreq = 110.0;
                      double sweepDir = 0.008;

                      audioTrack.play();

                      while (isPlaying) {
                          for (int i = 0; i < buffer.length; i++) {
                              sampleCount++;
                              double activeFreq = currentFreq;

                              if (currentMode == MODE_EXTREME) {
                                  // 110 Hz ile 340 Hz arasi surekli tarama (Sweep)
                                  sweepFreq += sweepDir;
                                  if (sweepFreq >= 340.0) sweepDir = -0.008;
                                  if (sweepFreq <= 110.0) sweepDir = 0.008;
                                  activeFreq = sweepFreq;
                              }

                              double increment = 2.0 * Math.PI * activeFreq / sampleRate;

                              if (currentMode == MODE_PULSE) {
                                  boolean mute = ((sampleCount / (sampleRate / 5)) % 2 == 1);
                                  buffer[i] = mute ? 0 : (short) (Math.sin(angle) * Short.MAX_VALUE);
                              } else if (currentMode == MODE_EXTREME) {
                                  // Strobe soklama: Her 180ms'de 30ms sert kesinti + Kare Dalga (Square Wave)
                                  long cycle = sampleCount % (sampleRate / 5);
                                  boolean shockMute = cycle > (sampleRate / 6);
                                  if (shockMute) {
                                      buffer[i] = 0;
                                  } else {
                                      // Kare dalga diyaframi maksimum uclara sertce vurur
                                      buffer[i] = (Math.sin(angle) >= 0.0) ? Short.MAX_VALUE : Short.MIN_VALUE;
                                  }
                              } else {
                                  buffer[i] = (short) (Math.sin(angle) * Short.MAX_VALUE);
                              }

                              angle += increment;
                              if (angle > 2.0 * Math.PI) {
                                  angle -= 2.0 * Math.PI;
                              }
                          }
                          audioTrack.write(buffer, 0, buffer.length);
                      }

                      if (enhancer != null) {
                          try {
                              enhancer.setEnabled(false);
                              enhancer.release();
                          } catch (Exception ignored) {}
                      }

                      try {
                          audioTrack.stop();
                      } catch (Exception ignored) {}
                      audioTrack.release();
                  });
                  audioThread.start();
              }

              private void stopCleaning() {
                  isPlaying = false;
                  if (vibrator != null) {
                      try {
                          vibrator.cancel();
                      } catch (Exception ignored) {}
                  }
                  if (audioThread != null) {
                      try {
                          audioThread.join(400);
                      } catch (InterruptedException ignored) {}
                      audioThread = null;
                  }
                  audioManager.setMode(AudioManager.MODE_NORMAL);
                  audioManager.setSpeakerphoneOn(false);
              }

              @Override
              protected void onDestroy() {
                  super.onDestroy();
                  stopCleaning();
              }
          }
          EOF

      - name: APK Derle
        run: gradle assembleDebug

      - name: APK Dosyasini Yukle
        uses: actions/upload-artifact@v4
        with:
          name: Ahize-Temizleyici-PRO-APK
          path: app/build/outputs/apk/debug/app-debug.apk
