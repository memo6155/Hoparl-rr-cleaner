name: Maksimum Ses APK Olustur

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: JDK 17 Kur
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Gradle 8.4 Kur
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Tum Proje Dosyalarini Otomatik Olustur
        run: |
          mkdir -p app/src/main/java/com/temizleyici/ses

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "AhizeTemizleyici"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.0' apply false
          }
          EOF

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.temizleyici.ses'
              compileSdk 34

              defaultConfig {
                  applicationId "com.temizleyici.ses"
                  minSdk 23
                  targetSdk 34
                  versionCode 3
                  versionName "3.0-MaxDB"
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />
              <uses-permission android:name="android.permission.VIBRATE" />

              <application
                  android:label="Ahize Turbo Ses"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/temizleyici/ses/MainActivity.java
          package com.temizleyici.ses;

          import android.app.Activity;
          import android.content.Context;
          import android.graphics.Color;
          import android.media.AudioAttributes;
          import android.media.AudioFormat;
          import android.media.AudioManager;
          import android.media.AudioTrack;
          import android.media.audiofx.DynamicsProcessing;
          import android.media.audiofx.LoudnessEnhancer;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.VibrationEffect;
          import android.os.Vibrator;
          import android.view.Gravity;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.SeekBar;
          import android.widget.TextView;

          public class MainActivity extends Activity {
              private static final int MODE_SINE_BOOST = 0;
              private static final int MODE_EXTREME_BASS_SHOCK = 1;
              private static final int MODE_MAX_DECIBEL_SIREN = 2;

              private volatile boolean isPlaying = false;
              private volatile double currentFreq = 165.0;
              private volatile int currentGainMb = 3000; // Varsayilan +30 dB (3000 mB)
              private volatile int currentMode = MODE_SINE_BOOST;
              private Thread audioThread;
              private AudioManager audioManager;
              private Vibrator vibrator;
              private TextView statusText;
              private TextView freqLabel;
              private TextView gainLabel;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  audioManager = (AudioManager) getSystemService(Context.AUDIO_SERVICE);
                  vibrator = (Vibrator) getSystemService(Context.VIBRATOR_SERVICE);

                  ScrollView scrollView = new ScrollView(this);
                  scrollView.setFillViewport(true);
                  scrollView.setBackgroundColor(Color.parseColor("#0A0A0A"));

                  LinearLayout layout = new LinearLayout(this);
                  layout.setOrientation(LinearLayout.VERTICAL);
                  layout.setGravity(Gravity.CENTER);
                  layout.setPadding(40, 40, 40, 40);

                  statusText = new TextView(this);
                  statusText.setText("MAKSIMUM DESIBEL MODU HAZIR\nSes otomatik %100'e kilitlenir ve +45 dB'ye kadar zorlanir.");
                  statusText.setTextSize(15f);
                  statusText.setTextColor(Color.WHITE);
                  statusText.setGravity(Gravity.CENTER);
                  statusText.setPadding(0, 0, 0, 32);

                  freqLabel = new TextView(this);
                  freqLabel.setText("Manuel Frekans: 165 Hz");
                  freqLabel.setTextSize(15f);
                  freqLabel.setTextColor(Color.parseColor("#00E676"));
                  freqLabel.setGravity(Gravity.CENTER);

                  SeekBar freqSeek = new SeekBar(this);
                  freqSeek.setMax(1500);
                  freqSeek.setProgress(165);
                  freqSeek.setOnSeekBarChangeListener(new SeekBar.OnSeekBarChangeListener() {
                      @Override
                      public void onProgressChanged(SeekBar s, int progress, boolean fromUser) {
                          int f = Math.max(60, progress);
                          currentFreq = f;
                          freqLabel.setText("Manuel Frekans: " + f + " Hz");
                      }
                      @Override public void onStartTrackingTouch(SeekBar s) {}
                      @Override public void onStopTrackingTouch(SeekBar s) {}
                  });

                  gainLabel = new TextView(this);
                  gainLabel.setText("Amfi Zorlama (Gain Boost): +30 dB (MAKS)");
                  gainLabel.setTextSize(15f);
                  gainLabel.setTextColor(Color.parseColor("#FF5252"));
                  gainLabel.setGravity(Gravity.CENTER);
                  gainLabel.setPadding(0, 24, 0, 0);

                  SeekBar gainSeek = new SeekBar(this);
                  gainSeek.setMax(3000);
                  gainSeek.setProgress(3000);
                  gainSeek.setOnSeekBarChangeListener(new SeekBar.OnSeekBarChangeListener() {
                      @Override
                      public void onProgressChanged(SeekBar s, int progress, boolean fromUser) {
                          currentGainMb = progress;
                          gainLabel.setText("Amfi Zorlama (Gain Boost): +" + (progress / 100) + " dB");
                      }
                      @Override public void onStartTrackingTouch(SeekBar s) {}
                      @Override public void onStopTrackingTouch(SeekBar s) {}
                  });

                  Button btnMaxDecibelEarpiece = new Button(this);
                  btnMaxDecibelEarpiece.setText("🔊 AHIZE MAKSIMUM YUKSEK SES + SOK\n(165Hz Hava Basinci + 950Hz Tiz + 45dB Amfi)");
                  btnMaxDecibelEarpiece.setBackgroundColor(Color.parseColor("#D50000"));
                  btnMaxDecibelEarpiece.setTextColor(Color.WHITE);
                  btnMaxDecibelEarpiece.setOnClickListener(v -> {
                      currentMode = MODE_MAX_DECIBEL_SIREN;
                      startCleaning(true, true);
                      statusText.setText("🔊 AHIZE MAKSIMUM DESIBEL AKTIF!\n165Hz Bas + 950Hz Yuksek Akustik Basinc + +45dB Overdrive!");
                  });

                  Button btnMaxDecibelSpeaker = new Button(this);
                  btnMaxDecibelSpeaker.setText("🔊 ANA HOPARLOR MAKSIMUM YUKSEK SES + SOK\n(Cift Katmanli Kare Dalga + 45dB Amfi)");
                  btnMaxDecibelSpeaker.setBackgroundColor(Color.parseColor("#FF6D00"));
                  btnMaxDecibelSpeaker.setTextColor(Color.WHITE);
                  btnMaxDecibelSpeaker.setOnClickListener(v -> {
                      currentMode = MODE_MAX_DECIBEL_SIREN;
                      startCleaning(false, true);
                      statusText.setText("🔊 ANA HOPARLOR MAKSIMUM DESIBEL AKTIF!\nKulaginizi hoparlore cok yaklastirmayin!");
                  });

                  Button btnExtremeBassEarpiece = new Button(this);
                  btnExtremeBassEarpiece.setText("🔥 AHIZE AGIR TITRESIM TARAMASI (110Hz-450Hz Kare Dalga)");
                  btnExtremeBassEarpiece.setBackgroundColor(Color.parseColor("#6A1B9A"));
                  btnExtremeBassEarpiece.setTextColor(Color.WHITE);
                  btnExtremeBassEarpiece.setOnClickListener(v -> {
                      currentMode = MODE_EXTREME_BASS_SHOCK;
                      startCleaning(true, true);
                      statusText.setText("🔥 Ahize Agir Diyafram Soklamasi (110-450 Hz) Calisiyor...");
                  });

                  Button btnManualEarpiece = new Button(this);
                  btnManualEarpiece.setText("Ahize Manuel Frekans (Kaydirici + Kare Dalga Boost)");
                  btnManualEarpiece.setOnClickListener(v -> {
                      currentMode = MODE_SINE_BOOST;
                      startCleaning(true, false);
                      statusText.setText("Ahize Manuel Mod (" + (int)currentFreq + " Hz) Calisiyor...");
                  });

                  Button btnStop = new Button(this);
                  btnStop.setText("⛔ DURDUR");
                  btnStop.setBackgroundColor(Color.parseColor("#263238"));
                  btnStop.setTextColor(Color.WHITE);
                  btnStop.setOnClickListener(v -> {
                      stopCleaning();
                      statusText.setText("Temizleme durduruldu.");
                  });

                  layout.addView(statusText);
                  layout.addView(freqLabel);
                  layout.addView(freqSeek);
                  layout.addView(gainLabel);
                  layout.addView(gainSeek);
                  layout.addView(btnMaxDecibelEarpiece);
                  layout.addView(btnMaxDecibelSpeaker);
                  layout.addView(btnExtremeBassEarpiece);
                  layout.addView(btnManualEarpiece);
                  layout.addView(btnStop);

                  scrollView.addView(layout);
                  setContentView(scrollView);
              }

              private void lockMaxVolume() {
                  try {
                      int[] streams = {
                          AudioManager.STREAM_VOICE_CALL,
                          AudioManager.STREAM_MUSIC,
                          AudioManager.STREAM_RING,
                          AudioManager.STREAM_ALARM,
                          AudioManager.STREAM_SYSTEM
                      };
                      for (int s : streams) {
                          int max = audioManager.getStreamMaxVolume(s);
                          audioManager.setStreamVolume(s, max, 0);
                      }
                  } catch (Exception ignored) {}
              }

              private void startVibration() {
                  if (vibrator != null && vibrator.hasVibrator()) {
                      long[] pattern = {0, 500, 80, 700, 80};
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                          vibrator.vibrate(VibrationEffect.createWaveform(pattern, 0));
                      } else {
                          vibrator.vibrate(pattern, 0);
                      }
                  }
              }

              private void startCleaning(boolean useEarpiece, boolean vibrateNow) {
                  stopCleaning();
                  isPlaying = true;

                  // ÖNCE ses yönlendirmesini yap, SONRA sesi %100'e çivile (Android ses düşürmesini engeller)
                  if (useEarpiece) {
                      audioManager.setMode(AudioManager.MODE_IN_COMMUNICATION);
                      audioManager.setSpeakerphoneOn(false);
                  } else {
                      audioManager.setMode(AudioManager.MODE_NORMAL);
                      audioManager.setSpeakerphoneOn(true);
                  }

                  lockMaxVolume();

                  if (vibrateNow) {
                      startVibration();
                  }

                  audioThread = new Thread(() -> {
                      int sampleRate = 44100;
                      int bufferSize = AudioTrack.getMinBufferSize(
                              sampleRate,
                              AudioFormat.CHANNEL_OUT_MONO,
                              AudioFormat.ENCODING_PCM_16BIT
                      );

                      int usageType = useEarpiece
                              ? AudioAttributes.USAGE_VOICE_COMMUNICATION
                              : AudioAttributes.USAGE_MEDIA;

                      AudioTrack audioTrack = new AudioTrack.Builder()
                              .setAudioAttributes(new AudioAttributes.Builder()
                                      .setUsage(usageType)
                                      .setContentType(AudioAttributes.CONTENT_TYPE_SPEECH)
                                      .build())
                              .setAudioFormat(new AudioFormat.Builder()
                                      .setEncoding(AudioFormat.ENCODING_PCM_16BIT)
                                      .setSampleRate(sampleRate)
                                      .setChannelMask(AudioFormat.CHANNEL_OUT_MONO)
                                      .build())
                              .setBufferSizeInBytes(bufferSize)
                              .build();

                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.LOLLIPOP) {
                          audioTrack.setVolume(AudioTrack.getMaxVolume());
                      }

                      // 1. Amfi: LoudnessEnhancer (+30 dB'ye kadar zorlama)
                      LoudnessEnhancer enhancer = null;
                      try {
                          enhancer = new LoudnessEnhancer(audioTrack.getAudioSessionId());
                          enhancer.setTargetGain(currentGainMb);
                          enhancer.setEnabled(true);
                      } catch (Exception ignored) {}

                      // 2. Amfi: DynamicsProcessing (+15 dB ekstra donanimsal on-kazanc)
                      DynamicsProcessing dp = null;
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.P) {
                          try {
                              DynamicsProcessing.Config config = new DynamicsProcessing.Config.Builder(
                                      DynamicsProcessing.VARIANT_FAVOR_FREQUENCY_RESOLUTION,
                                      1, true, 1, false, 0, false, 0, true
                              ).build();
                              dp = new DynamicsProcessing(0, audioTrack.getAudioSessionId(), config);
                              dp.setInputGainAllChannelsTo(15.0f);
                              dp.setEnabled(true);
                          } catch (Exception ignored) {}
                      }

                      short[] buffer = new short[bufferSize];
                      double angleLow = 0.0;
                      double angleHigh = 0.0;
                      long sampleCount = 0;
                      double sweepFreq = 120.0;
                      double sweepDir = 0.015;
                      int lastGain = currentGainMb;
                      int loopCounter = 0;

                      audioTrack.play();

                      while (isPlaying) {
                          loopCounter++;
                          // Her yarim saniyede bir sesin %100'de kaldigini garantiye al
                          if (loopCounter % 25 == 0) {
                              lockMaxVolume();
                              if (enhancer != null && lastGain != currentGainMb) {
                                  try {
                                      enhancer.setTargetGain(currentGainMb);
                                      lastGain = currentGainMb;
                                  } catch (Exception ignored) {}
                              }
                          }

                          for (int i = 0; i < buffer.length; i++) {
                              sampleCount++;

                              if (currentMode == MODE_MAX_DECIBEL_SIREN) {
                                  // Cift katmanli hibrit sok:
                                  // 165 Hz diyaframi maksimum iterken 750-1350 Hz rezonans dalgasi kulagi sagir edecek siddette basinc uretir
                                  sweepFreq += sweepDir * 2.5;
                                  if (sweepFreq >= 1350.0) sweepDir = -0.02;
                                  if (sweepFreq <= 750.0) sweepDir = 0.02;

                                  double incLow = 2.0 * Math.PI * 165.0 / sampleRate;
                                  double incHigh = 2.0 * Math.PI * sweepFreq / sampleRate;

                                  angleLow += incLow;
                                  angleHigh += incHigh;
                                  if (angleLow > 2.0 * Math.PI) angleLow -= 2.0 * Math.PI;
                                  if (angleHigh > 2.0 * Math.PI) angleHigh -= 2.0 * Math.PI;

                                  // Strobe darbesi (her 250ms'de 25ms sert vakum kesintisi)
                                  long cycle = sampleCount % (sampleRate / 4);
                                  if (cycle > (sampleRate / 4) - (sampleRate / 40)) {
                                      buffer[i] = 0;
                                  } else {
                                      double combined = (Math.sin(angleLow) * 0.55) + (Math.sin(angleHigh) * 0.45);
                                      // Sert Kare Dalga (Hard-Clipped Square Wave) = Maksimum akustik enerji
                                      buffer[i] = (combined >= 0.0) ? Short.MAX_VALUE : Short.MIN_VALUE;
                                  }

                              } else if (currentMode == MODE_EXTREME_BASS_SHOCK) {
                                  sweepFreq += sweepDir;
                                  if (sweepFreq >= 450.0) sweepDir = -0.012;
                                  if (sweepFreq <= 110.0) sweepDir = 0.012;

                                  double inc = 2.0 * Math.PI * sweepFreq / sampleRate;
                                  angleLow += inc;
                                  if (angleLow > 2.0 * Math.PI) angleLow -= 2.0 * Math.PI;

                                  long cycle = sampleCount % (sampleRate / 5);
                                  if (cycle > (sampleRate / 6)) {
                                      buffer[i] = 0;
                                  } else {
                                      buffer[i] = (Math.sin(angleLow) >= 0.0) ? Short.MAX_VALUE : Short.MIN_VALUE;
                                  }

                              } else {
                                  // Manuel Modda da maksimum ses icin kare dalga
                                  double inc = 2.0 * Math.PI * currentFreq / sampleRate;
                                  angleLow += inc;
                                  if (angleLow > 2.0 * Math.PI) angleLow -= 2.0 * Math.PI;
                                  buffer[i] = (Math.sin(angleLow) >= 0.0) ? Short.MAX_VALUE : Short.MIN_VALUE;
                              }
                          }
                          audioTrack.write(buffer, 0, buffer.length);
                      }

                      if (dp != null) {
                          try {
                              dp.setEnabled(false);
                              dp.release();
                          } catch (Exception ignored) {}
                      }
                      if (enhancer != null) {
                          try {
                              enhancer.setEnabled(false);
                              enhancer.release();
                          } catch (Exception ignored) {}
                      }
                      try {
                          audioTrack.stop();
                      } catch (Exception ignored) {}
                      audioTrack.release();
                  });
                  audioThread.start();
              }

              private void stopCleaning() {
                  isPlaying = false;
                  if (vibrator != null) {
                      try {
                          vibrator.cancel();
                      } catch (Exception ignored) {}
                  }
                  if (audioThread != null) {
                      try {
                          audioThread.join(400);
                      } catch (InterruptedException ignored) {}
                      audioThread = null;
                  }
                  audioManager.setMode(AudioManager.MODE_NORMAL);
                  audioManager.setSpeakerphoneOn(false);
              }

              @Override
              protected void onDestroy() {
                  super.onDestroy();
                  stopCleaning();
              }
          }
          EOF

      - name: APK Derle
        run: gradle assembleDebug

      - name: APK Dosyasini Yukle
        uses: actions/upload-artifact@v4
        with:
          name: Ahize-Turbo-Ses-APK
          path: app/build/outputs/apk/debug/app-debug.apk
