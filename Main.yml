name: Sadece Ahize Maksimum Ses APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: JDK 17 Kur
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Gradle 8.4 Kur
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Tum Proje Dosyalarini Otomatik Olustur
        run: |
          mkdir -p app/src/main/java/com/temizleyici/ses

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "AhizeMaksimumSes"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.0' apply false
          }
          EOF

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.temizleyici.ses'
              compileSdk 34

              defaultConfig {
                  applicationId "com.temizleyici.ses"
                  minSdk 23
                  targetSdk 34
                  versionCode 4
                  versionName "4.0-OnlyMaxEarpiece"
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />

              <application
                  android:label="Ahize Maksimum Ses"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/temizleyici/ses/MainActivity.java
          package com.temizleyici.ses;

          import android.app.Activity;
          import android.content.Context;
          import android.graphics.Color;
          import android.media.AudioAttributes;
          import android.media.AudioDeviceInfo;
          import android.media.AudioFormat;
          import android.media.AudioManager;
          import android.media.AudioTrack;
          import android.media.audiofx.DynamicsProcessing;
          import android.media.audiofx.LoudnessEnhancer;
          import android.os.Build;
          import android.os.Bundle;
          import android.view.Gravity;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.TextView;

          public class MainActivity extends Activity {
              private volatile boolean isPlaying = false;
              private Thread audioThread;
              private AudioManager audioManager;
              private TextView statusText;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  audioManager = (AudioManager) getSystemService(Context.AUDIO_SERVICE);

                  LinearLayout layout = new LinearLayout(this);
                  layout.setOrientation(LinearLayout.VERTICAL);
                  layout.setGravity(Gravity.CENTER);
                  layout.setPadding(60, 60, 60, 60);
                  layout.setBackgroundColor(Color.parseColor("#000000"));

                  statusText = new TextView(this);
                  statusText.setText("SADECE AHIZE MAKSIMUM SES\nButona bastiginizda ahizeden cikabilecek en yuksek ses seviyesi baslatilir.");
                  statusText.setTextSize(18f);
                  statusText.setTextColor(Color.WHITE);
                  statusText.setGravity(Gravity.CENTER);
                  statusText.setPadding(0, 0, 0, 80);

                  Button btnStart = new Button(this);
                  btnStart.setText("🔊 AHIZE EN YUKSEK SESI BASLAT");
                  btnStart.setTextSize(18f);
                  btnStart.setPadding(40, 60, 40, 60);
                  btnStart.setBackgroundColor(Color.parseColor("#D50000"));
                  btnStart.setTextColor(Color.WHITE);
                  btnStart.setOnClickListener(v -> {
                      startMaxEarpieceSound();
                      statusText.setText("⚠️ AHIZE TAM GUC CALISIYOR!\nKulaginizi ahizeye dayamayin.");
                  });

                  Button btnStop = new Button(this);
                  btnStop.setText("⛔ DURDUR");
                  btnStop.setTextSize(18f);
                  btnStop.setPadding(40, 50, 40, 50);
                  btnStop.setBackgroundColor(Color.parseColor("#263238"));
                  btnStop.setTextColor(Color.WHITE);
                  btnStop.setOnClickListener(v -> {
                      stopSound();
                      statusText.setText("Durduruldu.");
                  });

                  layout.addView(statusText);
                  layout.addView(btnStart);
                  layout.addView(btnStop);

                  setContentView(layout);
              }

              private AudioDeviceInfo findEarpieceDevice() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                      AudioDeviceInfo[] devices = audioManager.getDevices(AudioManager.GET_DEVICES_OUTPUTS);
                      for (AudioDeviceInfo d : devices) {
                          if (d.getType() == AudioDeviceInfo.TYPE_BUILTIN_EARPIECE) {
                              return d;
                          }
                      }
                  }
                  return null;
              }

              private void forceMaxVolumeAndEarpiece() {
                  try {
                      audioManager.setMode(AudioManager.MODE_IN_COMMUNICATION);
                      audioManager.setSpeakerphoneOn(false);

                      AudioDeviceInfo earpiece = findEarpieceDevice();
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.S && earpiece != null) {
                          audioManager.setCommunicationDevice(earpiece);
                      }

                      int[] streams = {
                          AudioManager.STREAM_VOICE_CALL,
                          AudioManager.STREAM_MUSIC,
                          AudioManager.STREAM_RING,
                          AudioManager.STREAM_ALARM,
                          AudioManager.STREAM_SYSTEM
                      };
                      for (int s : streams) {
                          int max = audioManager.getStreamMaxVolume(s);
                          audioManager.setStreamVolume(s, max, 0);
                      }
                  } catch (Exception ignored) {}
              }

              private void startMaxEarpieceSound() {
                  stopSound();
                  isPlaying = true;
                  forceMaxVolumeAndEarpiece();

                  audioThread = new Thread(() -> {
                      int sampleRate = 44100;
                      int bufferSize = AudioTrack.getMinBufferSize(
                              sampleRate,
                              AudioFormat.CHANNEL_OUT_MONO,
                              AudioFormat.ENCODING_PCM_16BIT
                      );

                      AudioTrack audioTrack = new AudioTrack.Builder()
                              .setAudioAttributes(new AudioAttributes.Builder()
                                      .setUsage(AudioAttributes.USAGE_VOICE_COMMUNICATION)
                                      .setContentType(AudioAttributes.CONTENT_TYPE_SPEECH)
                                      .build())
                              .setAudioFormat(new AudioFormat.Builder()
                                      .setEncoding(AudioFormat.ENCODING_PCM_16BIT)
                                      .setSampleRate(sampleRate)
                                      .setChannelMask(AudioFormat.CHANNEL_OUT_MONO)
                                      .build())
                              .setBufferSizeInBytes(bufferSize)
                              .build();

                      // Cikis cihazini dogrudan ahizeye zorla
                      AudioDeviceInfo earpiece = findEarpieceDevice();
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M && earpiece != null) {
                          audioTrack.setPreferredDevice(earpiece);
                      }

                      audioTrack.setVolume(AudioTrack.getMaxVolume());

                      // 1. Donanimsal Amfi Zorlamasi (+30 dB)
                      LoudnessEnhancer enhancer = null;
                      try {
                          enhancer = new LoudnessEnhancer(audioTrack.getAudioSessionId());
                          enhancer.setTargetGain(3000);
                          enhancer.setEnabled(true);
                      } catch (Exception ignored) {}

                      // 2. Cok Katmanli On-Kazanc (Pre-Gain +24 dB)
                      DynamicsProcessing dp = null;
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.P) {
                          try {
                              DynamicsProcessing.Config config = new DynamicsProcessing.Config.Builder(
                                      DynamicsProcessing.VARIANT_FAVOR_FREQUENCY_RESOLUTION,
                                      1, true, 1, false, 0, false, 0, false
                              ).build();
                              dp = new DynamicsProcessing(0, audioTrack.getAudioSessionId(), config);
                              dp.setInputGainAllChannelsTo(24.0f);
                              dp.setEnabled(true);
                          } catch (Exception ignored) {}
                      }

                      short[] buffer = new short[bufferSize];
                      double p1 = 0.0, p2 = 0.0, p3 = 0.0;
                      // Ahizenin filtreye takilmadan en siddetli bagirdigi akustik tepe noktalari
                      double inc1 = 2.0 * Math.PI * 950.0 / sampleRate;
                      double inc2 = 2.0 * Math.PI * 1850.0 / sampleRate;
                      double inc3 = 2.0 * Math.PI * 2650.0 / sampleRate;
                      int loopCount = 0;

                      audioTrack.play();

                      while (isPlaying) {
                          loopCount++;
                          if (loopCount % 20 == 0) {
                              forceMaxVolumeAndEarpiece();
                          }

                          for (int i = 0; i < buffer.length; i++) {
                              p1 += inc1;
                              p2 += inc2;
                              p3 += inc3;
                              if (p1 > 2.0 * Math.PI) p1 -= 2.0 * Math.PI;
                              if (p2 > 2.0 * Math.PI) p2 -= 2.0 * Math.PI;
                              if (p3 > 2.0 * Math.PI) p3 -= 2.0 * Math.PI;

                              double wave = Math.sin(p1) + Math.sin(p2) + Math.sin(p3);
                              // Her orneklemeyi (sample) %100 maksimum dijital sinira (+32767 / -32768) cak
                              buffer[i] = (wave >= 0.0) ? Short.MAX_VALUE : Short.MIN_VALUE;
                          }
                          audioTrack.write(buffer, 0, buffer.length);
                      }

                      if (dp != null) {
                          try {
                              dp.setEnabled(false);
                              dp.release();
                          } catch (Exception ignored) {}
                      }
                      if (enhancer != null) {
                          try {
                              enhancer.setEnabled(false);
                              enhancer.release();
                          } catch (Exception ignored) {}
                      }
                      try {
                          audioTrack.stop();
                      } catch (Exception ignored) {}
                      audioTrack.release();
                  });
                  audioThread.start();
              }

              private void stopSound() {
                  isPlaying = false;
                  if (audioThread != null) {
                      try {
                          audioThread.join(400);
                      } catch (InterruptedException ignored) {}
                      audioThread = null;
                  }
                  try {
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.S) {
                          audioManager.clearCommunicationDevice();
                      }
                      audioManager.setMode(AudioManager.MODE_NORMAL);
                  } catch (Exception ignored) {}
              }

              @Override
              protected void onDestroy() {
                  super.onDestroy();
                  stopSound();
              }
          }
          EOF

      - name: APK Derle
        run: gradle assembleDebug

      - name: APK Dosyasini Yukle
        uses: actions/upload-artifact@v4
        with:
          name: Ahize-Maksimum-Ses-APK
          path: app/build/outputs/apk/debug/app-debug.apk
